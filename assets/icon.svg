<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2347"/>
      <stop offset="1" stop-color="#090b17"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#53eafd" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#53eafd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53eafd"/>
      <stop offset="0.55" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#d05cf7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#halo)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
  <g transform="translate(128 128) scale(1.1) translate(-128 -128)">
  <g fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- 芯片 -->
    <rect x="70" y="70" width="116" height="116" rx="28" stroke-width="11" fill="#53eafd" fill-opacity="0.06"/>
    <!-- 四边引脚 -->
    <path d="M100 70V50M128 70V50M156 70V50M100 186V206M128 186V206M156 186V206M70 100H50M70 128H50M70 156H50M186 100H206M186 128H206M186 156H206" stroke-width="9"/>
  </g>
  <!-- 核心：向下的三角 = 硅基「之下」 -->
  <path d="M104 112Q98 112 101 117L123 151Q128 158 133 151L155 117Q158 112 152 112Z" fill="url(#neon)" filter="url(#glow)"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-en="Maid slacking punishment">女仆偷懒惩罚</title>
<script type="application/json" id="game-manifest">
{
  "id": "maid-punishment",
  "title": "女仆偷懒惩罚",
  "description": "保持踮脚站立；按下按钮会电击；长时间未受罚时 TD01 逐步增强刺激。可配合自动锁。",
  "howTo": "1. 映射电击设备（必需）\n2. 可选：QTZ/踮脚传感器、TD01、自动锁\n3. 设置时长与电击强度\n4. 开始后保持踮脚，偷懒会被惩罚",
  "version": "2.1.2",
  "devices": [
    {
      "id": "qtz",
      "label": "QTZ距离/按钮",
      "capabilities": [
        "distance",
        "buttonInput",
        "reporting"
      ],
      "required": false
    },
    {
      "id": "tiptoeSensor",
      "label": "踮脚压力传感器",
      "capabilities": [
        "tiptoePressure",
        "reporting"
      ],
      "required": false
    },
    {
      "id": "shock",
      "label": "电击设备",
      "capabilities": [
        "shock"
      ],
      "required": true
    },
    {
      "id": "motor",
      "label": "TD01刺激器",
      "capabilities": [
        "strength"
      ],
      "required": false
    },
    {
      "id": "lock",
      "label": "自动锁",
      "capabilities": [
        "lock"
      ],
      "required": false
    }
  ],
  "params": [
    {
      "key": "duration",
      "type": "number",
      "default": 10,
      "label": "游戏时长",
      "unit": "分钟",
      "description": "整局持续多久后自动结束",
      "group": "core",
      "min": 1,
      "max": 120,
      "step": 1
    },
    {
      "key": "shockIntensity",
      "type": "number",
      "default": 24,
      "label": "电击强度",
      "unit": "V",
      "description": "按钮触发时的电击电压",
      "group": "punish",
      "min": 1,
      "max": 50,
      "step": 1,
      "device": "shock",
      "recommended": "15–24"
    },
    {
      "key": "progressiveIntensity",
      "type": "boolean",
      "default": false,
      "label": "渐进强度",
      "description": "开启后电击强度会随时间缓慢上升",
      "group": "punish",
      "device": "shock"
    },
    {
      "key": "maxIntensityIncrease",
      "type": "number",
      "default": 10,
      "label": "电击最大增幅",
      "unit": "V",
      "description": "渐进模式下相对基础强度的最大增加量",
      "group": "punish",
      "min": 0,
      "max": 30,
      "step": 1,
      "device": "shock",
      "required": false
    },
    {
      "key": "allowUnsafeIntensity",
      "type": "boolean",
      "default": false,
      "label": "允许超过30V",
      "description": "关闭时强度上限 30V，开启请谨慎",
      "group": "advanced",
      "device": "shock",
      "required": false
    },
    {
      "key": "td01DelaySeconds",
      "type": "number",
      "default": 5,
      "label": "TD01启动延时",
      "unit": "秒",
      "description": "多久未受电击后开始增强 TD01",
      "group": "difficulty",
      "min": 0,
      "max": 300,
      "step": 1,
      "device": "motor"
    },
    {
      "key": "td01IntensityIncrease",
      "type": "number",
      "default": 50,
      "label": "TD01每5秒增幅",
      "description": "TD01 启动后每 5 秒增加的强度",
      "group": "difficulty",
      "min": 1,
      "max": 255,
      "step": 1,
      "device": "motor",
      "required": false
    },
    {
      "key": "td01ShockProbability",
      "type": "number",
      "default": 0,
      "label": "TD01启动时电击概率",
      "unit": "%",
      "description": "TD01 开始增强时额外电击的概率",
      "group": "punish",
      "min": 0,
      "max": 100,
      "step": 1,
      "device": "shock",
      "required": false
    },
    {
      "key": "manualStart",
      "type": "boolean",
      "default": false,
      "label": "手动开启",
      "description": "开启后需等待锁按键才真正开始计时",
      "group": "core",
      "device": "lock",
      "required": false
    },
    {
      "key": "tiptoePressureThreshold",
      "type": "number",
      "default": 100,
      "label": "踮脚压力阈值",
      "description": "压力高于此值视为踩住（未踮脚）",
      "group": "difficulty",
      "min": 1,
      "max": 1000,
      "step": 1,
      "device": "tiptoeSensor",
      "required": false
    },
    {
      "key": "tiptoeDebounceMs",
      "type": "number",
      "default": 300,
      "label": "压力防抖",
      "unit": "毫秒",
      "description": "踮脚状态切换的防抖时间",
      "group": "advanced",
      "min": 0,
      "max": 2000,
      "step": 50,
      "device": "tiptoeSensor",
      "required": false
    }
  ],
  "i18n": {
    "en": {
      "title": "Maid slacking punishment",
      "description": "Stay on tiptoe. A button press shocks. If unpunished for too long, TD01 ramps up. Optional auto lock.",
      "howTo": "1. Map a shock device (required)\n2. Optional: QTZ/tiptoe sensor, TD01, lock\n3. Set duration and shock intensity\n4. Stay on tiptoe; slacking is punished",
      "devices": {
        "qtz": "QTZ distance / button",
        "tiptoeSensor": "Tiptoe pressure sensor",
        "shock": "Shock device",
        "motor": "TD01 stimulator",
        "lock": "Auto lock"
      },
      "params": {
        "duration": "Duration",
        "shockIntensity": "Shock intensity",
        "progressiveIntensity": "Progressive intensity",
        "maxIntensityIncrease": "Max shock increase",
        "allowUnsafeIntensity": "Allow over 30V",
        "td01DelaySeconds": "TD01 start delay",
        "td01IntensityIncrease": "TD01 +every 5s",
        "td01ShockProbability": "TD01 start shock chance",
        "manualStart": "Manual start",
        "tiptoePressureThreshold": "Tiptoe pressure threshold",
        "tiptoeDebounceMs": "Pressure debounce"
      },
      "paramDescriptions": {
        "duration": "How long a round lasts before auto-end.",
        "shockIntensity": "Shock voltage on button press.",
        "progressiveIntensity": "When on, shock intensity slowly rises over time.",
        "maxIntensityIncrease": "Max extra voltage vs the base in progressive mode.",
        "allowUnsafeIntensity": "Off caps intensity at 30V. Turn on with care.",
        "td01DelaySeconds": "How long without shock before TD01 ramps up.",
        "td01IntensityIncrease": "TD01 intensity added every 5 seconds after start.",
        "td01ShockProbability": "Chance of an extra shock when TD01 starts ramping.",
        "manualStart": "When on, wait for the lock button before the timer starts.",
        "tiptoePressureThreshold": "Pressure above this means standing flat (not on tiptoe).",
        "tiptoeDebounceMs": "Debounce for tiptoe state changes."
      },
      "paramUnits": {
        "duration": "min",
        "shockDuration": "s",
        "td01DelaySeconds": "s",
        "tiptoeDebounceMs": "ms"
      }
    }
  }
}
</script>
<script src="/bridge-api/device-api-bridge.js"></script>
<script src="/bridge-api/game-i18n.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; }
  header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#eee; color:#333; font-size:12px; }
  main { margin-top:16px; display:grid; grid-template-columns:1fr; gap:12px; }
  .card { border:1px solid #ddd; border-radius:8px; padding:12px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  button { padding:8px 12px; border-radius:6px; border:1px solid #ccc; background:#fafafa; cursor:pointer; }
  button.primary { background:#2563eb; color:#fff; border-color:#1d4ed8; }
  .ok { color:#16a34a; }
  .warn { color:#f59e0b; }
  .err { color:#dc2626; }
  #logs { max-height:160px; overflow:auto; margin:0; padding-left:16px; }
</style>
</head>
<body>
  <header>
    <h2 data-en="Maid slacking punishment">女仆偷懒惩罚</h2>
    <span class="pill"><span data-en="Running:">运行中：</span><span data-bind="running">false</span></span>
    <span class="pill"><span data-en="Started:">开始时间：</span><span data-bind="startTime">-</span></span>
    <span class="pill"><span data-en="Lock:">加锁状态：</span><span data-bind="isLocked">false</span> <span data-bind="lockedText"></span></span>
  </header>
  <main>
    <section class="card">
      <h3 data-en="Progress">进度</h3>
      <p><span data-en="Seconds left:">剩余秒数：</span><strong data-bind="remainingSec">-</strong></p>
      <p class="warn" data-bind="statusText">-</p>
      <div class="actions">
        <button class="primary" data-action="pause"><span data-bind="btnText" data-en="Pause">暂停</span></button>
        <button data-action="forceStart" data-en="Force start">强制开始</button>
        <button data-action="unlock" data-en="Unlock">解锁</button>
      </div>
    </section>
    <section class="card">
      <h3 data-en="Sensors and punish">传感器与惩罚</h3>
      <p><span data-en="Button 1:">按钮1：</span><strong data-bind="button0Pressed">false</strong>；<span data-en="Button 2:">按钮2：</span><strong data-bind="button1Pressed">false</strong></p>
      <p data-show="hasPressure"><span data-en="Tiptoe pressure:">踮脚压力：</span><strong data-bind="pressure1">-</strong>；<span data-en="Pressure violation:">压力违规：</span><strong data-bind="pressureViolated">false</strong></p>
      <p><span data-en="Shocking:">电击中：</span><strong data-bind="isShocking">false</strong>；<span data-en="Shocks:">累计电击：</span><strong data-bind="shockCount">0</strong></p>
      <p><span data-en="TD01 active:">TD01激活：</span><strong data-bind="td01Active">false</strong>；<span data-en="Intensity:">强度：</span><strong data-bind="td01Intensity">0</strong></p>
    </section>
    <section class="card">
      <h3 data-en="Logs (last 10)">日志（最近10条）</h3>
      <ul id="logs"></ul>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>

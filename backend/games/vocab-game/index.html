{
  "id": "vocab-game",

  "description": "英文单词四选一中文释义，带自动朗读和语音选择。选错、超时或点「不认识」会电击，正确选项标绿，错选项标红，单词当天排到队尾，答对一次才算过。旧词首答正确后复习间隔逐次翻倍，进度和设置走账号云同步。",

  "permissions": ["microphone"],
  "models": [
    { "task": "asr", "id": "sense-voice-small-int8", "optional": true }
  ],
  "devices": [
    {
      "id": "shock",
      "label": "电击设备",
      "capabilities": ["shock"],
      "required": true
    },
    {
      "id": "lock",
      "label": "自动锁",
      "capabilities": ["lock"],
      "required": false
    }
  ],
  "params": [
    {
      "key": "shockVoltage",
      "type": "number",
      "default": 15,
      "min": 10,
      "max": 100,
      "step": 1,
      "unit": "V",
      "label": "电击强度",
      "description": "每次电击的电压，请谨慎设置，风险自行承担；游戏内设置页也能改，以最后修改的为准",
      "group": "punish",
      "device": "shock",
      "recommended": "15"
    },
    {
      "key": "shockDuration",
      "type": "number",
      "default": 2,
      "min": 1,
      "max": 10,
      "step": 1,
      "unit": "秒",
      "label": "电击持续时间",
      "description": "每次电击持续的时间；游戏内设置页也能改，以最后修改的为准",
      "group": "punish",
      "device": "shock"
    },
    {
      "key": "totalTime",
      "type": "number",
      "default": 60,
      "min": 0,
      "max": 600,
      "step": 1,
      "unit": "分钟",
      "label": "整体时间上限（0=不限）",
      "description": "从开始答题起算，到时结束并解锁，进度照常保存",
      "group": "advanced"
    },
    {
      "key": "autoStart",
      "type": "boolean",
      "default": false,
      "label": "自动进入本日学习",
      "description": "之前学过单词时，打开游戏直接进入学习页；今日任务已完成、未登录或同步失败时仍停在首页",
      "group": "core"
    }
  ],
  "i18n": {
    "en": {
      "title": "Vocabulary",
      "description": "Pick the Chinese meaning of an English word from four options, with automatic pronunciation and optional voice selection. A wrong answer, timeout or “Don't know” shocks you. The correct option turns green and a wrong selection turns red; the word goes to the end of today's queue and must be answered correctly once. Correct first answers double the review interval; progress and settings sync to your account.",

      "devices": {
        "shock": "Shock device",
        "lock": "Auto lock"
      },
      "params": {
        "shockVoltage": "Shock intensity",
        "shockDuration": "Shock duration",
        "totalTime": "Total time limit (0 = none)",
        "autoStart": "Enter today's study automatically"
      },

        "shockVoltage": "Voltage of each shock. Set with care; use at your own risk. The in-game Settings page can change it too; the last change wins.",
        "shockDuration": "How long one shock lasts. The in-game Settings page can change it too; the last change wins.",
        "totalTime": "Timed from the first question; the game ends and unlocks at the limit. Progress is saved.",
        "autoStart": "When you have studied before, opening the game goes straight to study. If today's plan is complete, you are signed out or sync failed, it stays on the home page."
      },
      "paramUnits": {
        "totalTime": "min",
        "shockDuration": "s"
      }
    }
  }
}

  body.voice-mode .vg-opt-hint { display: inline; }
  .vg-opt.correct { border-color: var(--green); background: rgba(34,197,94,.16); color: #bbf7d0; }
  .vg-opt.correct .vg-badge { border-color: var(--green); color: #bbf7d0; background: rgba(34,197,94,.2); }
  .vg-opt.wrong { border-color: var(--red); background: rgba(239,68,68,.13); color: #fecaca; animation: vg-shake .26s ease 2; }
  .vg-opt.wrong .vg-badge { border-color: var(--red); color: #fecaca; background: rgba(239,68,68,.2); }
  @keyframes vg-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .vg-study-actions { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .vg-unknown { display: block; margin: 0; min-height: 40px; padding: 8px 12px; border: none; background: transparent; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .vg-unknown:hover { color: var(--text); }
  .vg-answer { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .vg-answer .vg-btn.primary { flex: none; width: auto; min-height: 44px; margin-top: 0; padding: 8px 12px; font-size: 14px; }
  .vg-answer-countdown { flex: 1; min-width: 0; color: var(--muted); font-size: 14px; text-align: center; }
  #vg-voice-toggle[aria-pressed="true"] { color: var(--green); border-color: var(--green); }
  .vg-btn { width: 100%; min-height: 52px; border: none; border-radius: 11px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .vg-btn.primary { background: var(--blue); color: #fff; margin-top: 16px; }
  .vg-btn.primary:disabled { opacity: .45; cursor: default; }
  .vg-voice { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: #d1d5db; font-size: 12px; }
  .vg-voice i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .vg-voice.recognizing i { background: var(--amber); }
  .vg-voice.missed i { background: var(--red); }
  .vg-toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 26; max-width: min(90vw, 420px); padding: 9px 16px; border-radius: 9px; background: rgba(17,24,39,.96); border: 1px solid #4b5563; color: #f3f4f6; font-size: 13px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .vg-gate { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(9,13,22,.94); }
  .vg-gate-box { width: 100%; max-width: 420px; text-align: center; }
  .vg-gate-box h2 { margin: 0 0 8px; font-size: 24px; color: #f9fafb; }
  .vg-gate-box p { margin: 0 0 20px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .vg-gate-box button { width: 100%; min-height: 60px; border: none; border-radius: 14px; background: var(--blue); color: #fff; font-size: 19px; font-weight: 800; cursor: pointer; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) {
    .vg-options { grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
    .vg-status-main, .vg-status-stats { gap: 5px; }
    .vg-home-btn { min-height: 36px; font-size: 14px; padding-right: 6px; }
    .vg-status-stats { font-size: 11px; }
    .vg-chip { padding: 2px 6px; gap: 3px; }
    .vg-time-label { display: none; }
    .vg-qbar { margin-bottom: 10px; }
    .vg-word-card { padding: 14px 12px 12px; border-radius: 14px; }
    .vg-word { font-size: 32px; }
    .vg-phonetic-row { margin-top: 4px; }
    .vg-phonetic { font-size: 14px; }
    .vg-opt { gap: 9px; min-height: 52px; font-size: 16px; line-height: 1.35; padding: 8px 10px; }
    .vg-badge { width: 26px; height: 26px; font-size: 13px; }
    body.voice-mode .vg-opt-hint { display: none; }
  }
  @media (max-width: 420px) {
    body { padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
    .vg-home-title { font-size: 20px; }
    .vg-task-card { padding: 16px 14px; border-radius: 17px; }
    .vg-task-metrics { gap: 12px; }
    .vg-metric-num { font-size: 28px; }
    .vg-start-main { min-height: 58px; font-size: 18px; }
    .vg-bank-name { font-size: 19px; }
    .vg-stat-row { gap: 7px; }
    .vg-stat-card { padding: 11px 5px; }
    .vg-stat-card b { font-size: 19px; }
    .vg-settings-box { padding: 0 12px; }
    .vg-set-label { font-size: 14px; }
    .vg-stepper button { width: 36px; }
    .vg-stepper input { width: 48px; }
    .vg-status { gap: 5px; font-size: 11px; }
    .vg-bank { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="vg-root" id="vg-root">
    <section class="vg-view" id="vg-home">
      <header class="vg-topbar">
        <div class="vg-home-title"><span data-en="Vocabulary">背单词</span><span class="vg-dot offline" id="vg-sync-dot" title="离线"></span></div>
        <button class="vg-icon-btn" id="vg-settings-btn" type="button" aria-label="设置" data-en-title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.62l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.86a.5.5 0 0 0 .12.62l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.62l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.62l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
      </header>
      <div class="vg-task-card" id="vg-task-card">
        <div id="vg-task-main">
          <div class="vg-task-label" data-en="Today's task">今日任务</div>
          <div class="vg-task-metrics">
            <div class="vg-metric">
              <div class="vg-metric-head"><span data-en="New">新词</span><b class="vg-metric-num" id="vg-home-new">0</b><span class="vg-metric-total" id="vg-home-new-total">/0</span></div>
              <div class="vg-metric-bar"><i id="vg-home-new-bar"></i></div>
            </div>
            <div class="vg-metric">
              <div class="vg-metric-head"><span data-en="Review">复习</span><b class="vg-metric-num" id="vg-home-review">0</b><span class="vg-metric-total" id="vg-home-review-total">/0</span></div>
              <div class="vg-metric-bar"><i id="vg-home-review-bar"></i></div>
            </div>
          </div>
          <button class="vg-start-main" id="vg-start-btn" type="button" disabled>开始学习</button>
          <div class="vg-lock-hint" id="vg-lock-hint" hidden></div>
        </div>
        <div id="vg-task-done" hidden>
          <div class="vg-done-title"><span>✓</span><span data-en="Today's task complete">今日已完成</span></div>
          <div class="vg-done-sub" id="vg-done-sub"></div>
          <div class="vg-done-actions"><button class="vg-btn-secondary" id="vg-extra" type="button" data-en="Study another set">再学一组</button></div>
        </div>
        <div class="vg-note" id="vg-home-note" hidden></div>
        <div class="vg-note" id="vg-voice-note" hidden data-en="Speech recognition unavailable; using tap mode.">语音识别不可用，已改用点选</div>
      </div>
      <div class="vg-card vg-bank-card">
        <div class="vg-bank-head">
          <div><div class="vg-bank-name" id="vg-home-bank">—</div><div class="vg-bank-sub" id="vg-home-bank-progress"></div></div>
          <button class="vg-link-btn" id="vg-change-bank" type="button"><span data-en="Change bank">更换词书</span> ›</button>
        </div>
        <div class="vg-progress"><i id="vg-home-bank-bar"></i></div>
      </div>
      <div class="vg-stat-row">
        <div class="vg-stat-card"><b id="vg-stat-accuracy">—</b><span data-en="First-answer accuracy today">今日首答正确率</span></div>
        <div class="vg-stat-card"><b id="vg-stat-due">0</b><span data-en="Due tomorrow">明日待复习</span></div>
        <div class="vg-stat-card"><b id="vg-stat-learned">0</b><span data-en="Words learned">累计已学</span></div>
      </div>
    </section>
    <section class="vg-view" id="vg-banks" hidden>
      <header class="vg-page-head">
        <button class="vg-back" id="vg-banks-back" type="button">‹ <span data-en="Back">返回</span></button>
        <div class="vg-page-title" data-en="Change word bank">更换词书</div>
      </header>
      <div class="vg-bank-list" id="vg-bank-list"></div>
    </section>

    <section class="vg-view" id="vg-settings" hidden>
      <header class="vg-page-head">
        <button class="vg-back" id="vg-settings-back" type="button">‹ <span data-en="Back">返回</span></button>
        <div class="vg-page-title" data-en="Settings">设置</div>
      </header>
      <div class="vg-settings-group">
        <h3 data-en="Study">学习</h3>
        <div class="vg-settings-box">
          <div class="vg-set-row"><span class="vg-set-label" data-en="Word bank">当前词书</span><button class="vg-set-value" id="vg-set-bank" type="button">— ›</button></div>
          <div class="vg-set-row"><span class="vg-set-label" data-en="New words per day">每日新词数</span>
            <span class="vg-stepper" data-key="newPerDay" data-min="0" data-max="200" data-step="1"><button type="button" data-delta="-1">−</button><input type="number" inputmode="numeric" aria-label="每日新词数" /><button type="button" data-delta="1">+</button></span>
          </div>
          <div class="vg-set-row"><span class="vg-set-label" data-en="Daily review cap">每日复习上限</span>
            <span class="vg-stepper" data-key="reviewCap" data-min="0" data-max="500" data-step="1"><button type="button" data-delta="-1">−</button><input type="number" inputmode="numeric" aria-label="每日复习上限" /><button type="button" data-delta="1">+</button></span>
          </div>
          <div class="vg-set-row"><span class="vg-set-label" data-en="Time per question (0 = none)">每题限时（秒）</span>
            <span class="vg-stepper" data-key="questionTime" data-min="0" data-max="120" data-step="1"><button type="button" data-delta="-1">−</button><input type="number" inputmode="numeric" aria-label="每题限时" /><button type="button" data-delta="1">+</button></span>
          </div>
          <div class="vg-set-row"><span class="vg-set-label" data-en="Answer mode">选择方式</span>
            <span class="vg-seg" id="vg-set-inputMode"><button type="button" data-value="touch" data-en="Tap">点选</button><button type="button" data-value="voice" data-en="Voice">语音</button></span>
          </div>
          <div class="vg-set-row"><span class="vg-set-label" data-en="Speak the word">自动朗读单词</span>
            <button class="vg-switch on" id="vg-set-autoSpeak" type="button" role="switch" aria-label="自动朗读单词"><i></i></button>
          </div>
          <div class="vg-set-row"><span class="vg-set-label" data-en="Shock on “Don't know”">「不认识」也电击</span>
            <button class="vg-switch on" id="vg-set-punishUnknown" type="button" role="switch" aria-label="「不认识」也电击"><i></i></button>
          </div>
        </div>
      </div>
      <div class="vg-settings-group">
        <h3 data-en="Shock">电击</h3>
        <div class="vg-settings-box">
          <div class="vg-set-row"><span class="vg-set-label" data-en="Shock intensity (V)">电击强度（V）</span>
            <span class="vg-stepper" data-key="shockVoltage" data-min="10" data-max="100" data-step="1"><button type="button" data-delta="-1">−</button><input type="number" inputmode="numeric" aria-label="电击强度" /><button type="button" data-delta="1">+</button></span>
          </div>
          <div class="vg-set-row"><span class="vg-set-label" data-en="Shock duration">电击持续时间（秒）</span>
            <span class="vg-stepper" data-key="shockDuration" data-min="1" data-max="10" data-step="1"><button type="button" data-delta="-1">−</button><input type="number" inputmode="numeric" aria-label="电击持续时间" /><button type="button" data-delta="1">+</button></span>
          </div>
        </div>
        <div class="vg-settings-note" data-en="Changes here apply to this device only; if changed later on the client config page, the config page wins.">这里的修改只在本机生效；在客户端配置页修改后以配置页为准</div>
      </div>
    </section>
    <section class="vg-view" id="vg-play" hidden>
      <header class="vg-status" id="vg-status">
        <div class="vg-status-main">
        <button class="vg-home-btn" id="vg-home-btn" type="button">‹ <span data-en="Home">首页</span></button>
        <span class="vg-bank" id="vg-bank">四级</span>
        <button class="vg-home-btn" id="vg-voice-toggle" type="button" aria-pressed="false" data-en="Enable voice">开启语音</button>
        <span class="vg-dot offline" id="vg-sync-dot-play" title="离线"></span>
        </div>
        <div class="vg-status-stats">
        <span class="vg-chip"><span data-en="New">新词</span> <b id="vg-new">0/0</b></span>
        <span class="vg-chip"><span data-en="Review">复习</span> <b id="vg-review">0/0</b></span>
        <span class="vg-chip"><span data-en="Left">剩余</span> <b id="vg-left">0</b></span>
        <span class="vg-chip"><span class="vg-time-label" data-en="Total left">总时间</span> <b id="vg-total">—</b></span>
        </div>
      </header>
      <div class="vg-qbar" id="vg-qbar-wrap"><i id="vg-qbar" style="width:100%"></i></div>
      <div class="vg-word-card">
        <span class="vg-shock" id="vg-shock" role="status" aria-label="电击中" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-13h-7l1-7z"/></svg></span>
        <div class="vg-word" id="vg-word">—</div>
        <div class="vg-phonetic-row">
          <span class="vg-phonetic" id="vg-phonetic"></span>
          <button class="vg-speak" id="vg-speak" type="button" title="重播" data-en-title="Play again" aria-label="重播" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
        </div>
      </div>
      <div class="vg-options" id="vg-options">
        <button class="vg-opt" type="button" data-index="1"><span class="vg-badge">1</span><span class="vg-opt-text"></span><span class="vg-opt-hint" data-en="1st">第一个</span></button>
        <button class="vg-opt" type="button" data-index="2"><span class="vg-badge">2</span><span class="vg-opt-text"></span><span class="vg-opt-hint" data-en="2nd">第二个</span></button>
        <button class="vg-opt" type="button" data-index="3"><span class="vg-badge">3</span><span class="vg-opt-text"></span><span class="vg-opt-hint" data-en="3rd">第三个</span></button>
        <button class="vg-opt" type="button" data-index="4"><span class="vg-badge">4</span><span class="vg-opt-text"></span><span class="vg-opt-hint" data-en="4th">第四个</span></button>
      </div>
      <div class="vg-study-actions">
        <button class="vg-unknown" id="vg-unknown" type="button" data-en="Don't know">不认识</button>
        <div class="vg-voice" id="vg-voice" hidden><i></i><span id="vg-voice-text" data-en="Listening">监听中</span></div>
      </div>
      <section class="vg-answer" id="vg-answer" hidden>
        <div class="vg-answer-countdown" id="vg-answer-countdown"></div>
        <button class="vg-btn primary" id="vg-continue" type="button" data-en="Continue">继续</button>
      </section>
    </section>
  </div>
  <div class="vg-toast" id="vg-toast" hidden></div>
  <div class="vg-gate" id="vg-gate" hidden>
    <div class="vg-gate-box">
      <h2 data-en="Tap to start">点一下开始</h2>
      <p data-en="Voice mode needs one tap to enable the microphone.">语音模式需要一次点击才能启用麦克风</p>
      <button id="vg-gate-btn" type="button" data-en="Start studying">开始学习</button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-en="Vocabulary">背单词</title>
<script type="application/json" id="game-manifest">
{
  "id": "vocab-game",
  "title": "背单词",
  "description": "英文单词四选一中文释义，带自动朗读和语音选择。选错、超时或点「不认识」会电击并显示完整释义，单词当天排到队尾，答对一次才算过。旧词首答正确后复习间隔逐次翻倍，进度走账号云同步。",
  "howTo": "1. 映射电击设备（必需），可选映射自动锁\n2. 在配置里选词库、每天新词数、复习上限和每题/总时长\n3. 登录客户端账号后开始；开始页会读取今日计划\n4. 点选中文释义，也可以开语音模式说「第一个」到「第四个」\n5. 今日计划全部答对一次即完成并解锁；点「再学一组」可继续加新词",
  "version": "1.0.0",
  "permissions": ["microphone"],
  "models": [
    { "task": "asr", "id": "sense-voice-small-int8", "optional": true }
  ],
  "devices": [
    {
      "id": "shock",
      "label": "电击设备",
      "capabilities": ["shock"],
      "required": true
    },
    {
      "id": "lock",
      "label": "自动锁",
      "capabilities": ["lock"],
      "required": false
    }
  ],
  "params": [
    {
      "key": "bank",
      "type": "enum",
      "default": "cet4",
      "enum": ["gaokao", "cet4", "cet6", "ielts"],
      "enumLabels": {
        "gaokao": "高考",
        "cet4": "四级",
        "cet6": "六级",
        "ielts": "雅思"
      },
      "label": "词库",
      "description": "四个词库共用一份进度；当前词库里学过的词不会在其他词库里再当新词出现",
      "group": "core"
    },
    {
      "key": "newPerDay",
      "type": "number",
      "default": 20,
      "min": 0,
      "max": 200,
      "step": 1,
      "unit": "个",
      "label": "每日新词数",
      "description": "每天从当前词库按顺序取多少个没学过的词",
      "group": "core"
    },
    {
      "key": "reviewCap",
      "type": "number",
      "default": 100,
      "min": 0,
      "max": 500,
      "step": 1,
      "unit": "个",
      "label": "每日复习上限",
      "description": "到期的旧词最多当天复习多少个，超出的顺延，到期最早的先出",
      "group": "core"
    },
    {
      "key": "questionTime",
      "type": "number",
      "default": 20,
      "min": 0,
      "max": 120,
      "step": 1,
      "unit": "秒",
      "label": "每题限时（0=不限）",
      "description": "倒计时结束算答错并电击",
      "group": "core"
    },
    {
      "key": "totalTime",
      "type": "number",
      "default": 60,
      "min": 0,
      "max": 600,
      "step": 1,
      "unit": "分钟",
      "label": "整体时间上限（0=不限）",
      "description": "从开始答题起算，到时结束并解锁，进度照常保存",
      "group": "advanced"
    },
    {
      "key": "inputMode",
      "type": "enum",
      "default": "touch",
      "enum": ["touch", "voice"],
      "enumLabels": {
        "touch": "点选",
        "voice": "语音"
      },
      "label": "选择方式",
      "description": "语音模式说「第一个」到「第四个」；语音模式也可以点选",
      "group": "core"
    },
    {
      "key": "autoSpeak",
      "type": "boolean",
      "default": true,
      "label": "自动朗读单词",
      "description": "出题时用系统语音读一遍单词；朗读期间和之后 0.5 秒不收音",
      "group": "core"
    },
    {
      "key": "punishUnknown",
      "type": "boolean",
      "default": true,
      "label": "「不认识」也电击",
      "description": "关闭后点「不认识」只显示答案、不电击",
      "group": "punish"
    },
    {
      "key": "shockVoltage",
      "type": "number",
      "default": 15,
      "min": 10,
      "max": 100,
      "step": 1,
      "unit": "V",
      "label": "电击强度",
      "description": "每次电击的电压，请谨慎设置，风险自行承担",
      "group": "punish",
      "device": "shock",
      "recommended": "15"
    },
    {
      "key": "shockDuration",
      "type": "number",
      "default": 2,
      "min": 1,
      "max": 10,
      "step": 1,
      "unit": "秒",
      "label": "电击持续时间",
      "description": "每次电击持续的时间",
      "group": "punish",
      "device": "shock"
    }
  ],
  "i18n": {
    "en": {
      "title": "Vocabulary",
      "description": "Pick the Chinese meaning of an English word from four options, with automatic pronunciation and optional voice selection. A wrong answer, timeout or “Don't know” shocks you and shows the full meaning; the word goes to the end of today's queue and must be answered correctly once. Correct first answers double the review interval; progress syncs to your account.",
      "howTo": "1. Map a shock device (required); optionally map an auto lock\n2. Choose a bank, daily new words, review cap and question/total time limits\n3. Sign in to the client account and press Start; the start page loads today's plan\n4. Tap a meaning, or turn on voice mode and say “first” to “fourth”\n5. Finish today's plan to unlock; “Study another set” adds more new words",
      "devices": {
        "shock": "Shock device",
        "lock": "Auto lock"
      },
      "enumLabels": {
        "bank": {
          "gaokao": "Gaokao",
          "cet4": "CET-4",
          "cet6": "CET-6",
          "ielts": "IELTS"
        },
        "inputMode": {
          "touch": "Tap",
          "voice": "Voice"
        }
      },
      "params": {
        "bank": "Word bank",
        "newPerDay": "New words per day",
        "reviewCap": "Daily review cap",
        "questionTime": "Time per question (0 = none)",
        "totalTime": "Total time limit (0 = none)",
        "inputMode": "Answer mode",
        "autoSpeak": "Speak the word",
        "punishUnknown": "Shock on “Don't know”",
        "shockVoltage": "Shock intensity",
        "shockDuration": "Shock duration"
      },
      "paramDescriptions": {
        "bank": "All four banks share one progress record; a word learned in any bank never appears as a new word again.",
        "newPerDay": "How many unseen words to take from the current bank each day, in bank order.",
        "reviewCap": "Maximum due words reviewed per day. Extra words wait for the next day, earliest due first.",
        "questionTime": "When the countdown ends the question counts as wrong and shocks.",
        "totalTime": "Timed from the first question; the game ends and unlocks at the limit. Progress is saved.",
        "inputMode": "Voice mode accepts “first” to “fourth”; tapping still works.",
        "autoSpeak": "Reads the word with the system voice. Audio during the word and 0.5 s after is ignored.",
        "punishUnknown": "When off, “Don't know” only shows the answer without a shock.",
        "shockVoltage": "Voltage of each shock. Set with care; use at your own risk.",
        "shockDuration": "How long one shock lasts."
      },
      "paramUnits": {
        "newPerDay": "words",
        "reviewCap": "words",
        "questionTime": "s",
        "totalTime": "min",
        "shockDuration": "s"
      }
    }
  }
}
</script>
<script src="/bridge-api/device-api-bridge.js"></script>
<script src="/bridge-api/game-i18n.js"></script>
<script src="banks/gaokao.js"></script>
<script src="banks/cet4.js"></script>
<script src="banks/cet6.js"></script>
<script src="banks/ielts.js"></script>
<script src="vocab-core.js"></script>
<script src="voice.js"></script>
<style>
  :root { color-scheme: dark; --bg:#111827; --panel:#1f2937; --deep:#0b1220; --text:#e5e7eb; --muted:#9ca3af; --line:#374151; --red:#ef4444; --green:#22c55e; --amber:#f59e0b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif; padding: 14px 14px calc(84px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }
  button { font-family: inherit; }
  .vg-root { position: relative; width: 100%; max-width: 940px; margin: 0 auto; }
  .vg-status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px 0 8px; font-size: 12px; color: var(--muted); }
  .vg-bank { font-size: 15px; font-weight: 700; color: #f9fafb; margin-right: 2px; }
  .vg-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--panel); white-space: nowrap; }
  .vg-chip b { color: #f3f4f6; font-weight: 700; font-variant-numeric: tabular-nums; }
  .vg-dot { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; margin-left: auto; box-shadow: 0 0 0 2px rgba(255,255,255,.06); }
  .vg-dot.synced { background: var(--green); }
  .vg-dot.pending, .vg-dot.syncing { background: var(--amber); }
  .vg-dot.offline { background: #6b7280; }
  .vg-qbar { height: 4px; border-radius: 999px; background: var(--panel); overflow: hidden; margin-bottom: 14px; }
  .vg-qbar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#22c55e,#4ade80); transition: width .12s linear, background .2s ease; }
  .vg-qbar > i.urgent { background: linear-gradient(90deg,#dc2626,#ef4444); }
  .vg-view { width: 100%; }
  .vg-card { background: var(--deep); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .vg-start-card { max-width: 560px; margin: 28px auto 0; }
  .vg-start-title { font-size: 26px; font-weight: 800; color: #f9fafb; margin-bottom: 18px; text-align: center; }
  .vg-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 10px 0; border-bottom: 1px solid rgba(55,65,81,.7); font-size: 14px; color: var(--muted); }
  .vg-kv b { color: #f3f4f6; font-size: 15px; text-align: right; }
  .vg-note { margin-top: 12px; padding: 9px 12px; border-radius: 9px; background: #422006; border: 1px solid #92400e; color: #fde68a; font-size: 13px; line-height: 1.5; }
  .vg-note.bad { background: #450a0a; border-color: #991b1b; color: #fecaca; }
  .vg-btn { width: 100%; min-height: 52px; border: none; border-radius: 11px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .vg-btn.primary { background: #2563eb; color: #fff; margin-top: 18px; }
  .vg-btn.primary:disabled { opacity: .45; cursor: default; }
  .vg-btn.ghost { background: var(--panel); color: var(--text); margin-top: 10px; }
  .vg-word-card { background: var(--deep); border: 1px solid var(--line); border-radius: 18px; padding: 30px 18px 24px; text-align: center; }
  .vg-word { font-size: 42px; line-height: 1.15; font-weight: 800; letter-spacing: .5px; color: #f9fafb; word-break: break-word; }
  .vg-phonetic-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; min-height: 30px; }
  .vg-phonetic { font-size: 17px; color: var(--muted); }
  .vg-speak { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: #d1d5db; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .vg-speak:hover { border-color: #6b7280; color: #fff; }
  .vg-speak svg { width: 17px; height: 17px; fill: currentColor; }
  .vg-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .vg-opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--text); font-size: 18px; line-height: 1.4; text-align: left; cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .1s ease; }
  .vg-opt:hover:not(:disabled) { border-color: #6b7280; }
  .vg-opt:disabled { cursor: default; }
  .vg-badge { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--deep); border: 1px solid #4b5563; color: #d1d5db; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .vg-opt-text { flex: 1; min-width: 0; }
  .vg-opt-hint { flex: none; font-size: 11px; color: var(--muted); display: none; }
  body.voice-mode .vg-opt-hint { display: inline; }
  .vg-opt.correct { border-color: var(--green); background: rgba(34,197,94,.16); }
  .vg-opt.correct .vg-badge { border-color: var(--green); color: #bbf7d0; background: rgba(34,197,94,.2); }
  .vg-opt.wrong { border-color: var(--red); background: rgba(239,68,68,.13); animation: vg-shake .26s ease 2; }
  .vg-opt.wrong .vg-badge { border-color: var(--red); color: #fecaca; background: rgba(239,68,68,.2); }
  @keyframes vg-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .vg-unknown { display: block; margin: 12px auto 0; padding: 10px 16px; border: none; background: transparent; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .vg-unknown:hover { color: var(--text); }
  .vg-answer { margin-top: 14px; padding: 18px; border-radius: 14px; border: 1px solid #4b5563; background: linear-gradient(180deg, #172033, #0b1220); }
  .vg-answer-word { font-size: 28px; font-weight: 800; color: #f9fafb; text-align: center; }
  .vg-answer-phonetic { font-size: 15px; color: var(--muted); text-align: center; margin-top: 2px; }
  .vg-answer-meaning { margin-top: 12px; font-size: 16px; line-height: 1.65; color: #e5e7eb; text-align: left; }
  .vg-answer .vg-btn { margin-top: 16px; }
  .vg-voice { position: fixed; right: 14px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 25; display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; background: rgba(31,41,55,.94); border: 1px solid var(--line); color: #d1d5db; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .vg-voice i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .vg-voice.recognizing i { background: var(--amber); }
  .vg-voice.missed i { background: var(--red); }
  .vg-toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 26; max-width: min(90vw, 420px); padding: 9px 16px; border-radius: 9px; background: rgba(17,24,39,.96); border: 1px solid #4b5563; color: #f3f4f6; font-size: 13px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .vg-complete { max-width: 620px; margin: 22px auto 0; text-align: center; }
  .vg-complete h1 { font-size: 30px; margin: 0 0 4px; color: var(--green); }
  .vg-complete.ended h1 { color: var(--amber); }
  .vg-complete .sub { font-size: 14px; color: var(--muted); }
  .vg-stats { display: flex; justify-content: center; gap: 30px; margin: 22px 0 4px; flex-wrap: wrap; }
  .vg-stats > div { min-width: 92px; }
  .vg-stats b { display: block; font-size: 28px; font-weight: 800; color: #f9fafb; font-variant-numeric: tabular-nums; }
  .vg-stats span { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .vg-complete .vg-btn { max-width: 340px; margin-left: auto; margin-right: auto; }
  .vg-stop { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(17,24,39,0), rgba(17,24,39,.96) 30%); }
  .vg-stop button { display: block; width: 100%; max-width: 940px; margin: 0 auto; min-height: 52px; border: none; border-radius: 10px; background: #b91c1c; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .vg-stop button:hover { background: #dc2626; }
  .vg-test-badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: #78350f; color: #fde68a; font-size: 11px; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) {
    .vg-options { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    body { padding: 10px 10px calc(78px + env(safe-area-inset-bottom, 0px)); }
    .vg-status { gap: 5px; font-size: 11px; }
    .vg-bank { font-size: 14px; }
    .vg-chip { padding: 2px 7px; }
    .vg-word-card { padding: 22px 12px 18px; }
    .vg-word { font-size: 36px; }
    .vg-opt { min-height: 56px; font-size: 17px; padding: 10px 12px; }
    .vg-start-card { padding: 18px 14px; margin-top: 16px; }
    .vg-start-title { font-size: 23px; }
    .vg-kv { font-size: 13px; }
    .vg-kv b { font-size: 14px; }
    .vg-stats { gap: 18px; }
    .vg-stats b { font-size: 24px; }
    .vg-stop button { min-height: 50px; font-size: 15px; }
  }
</style>
</head>
<body>
  <div class="vg-root">
    <header class="vg-status" id="vg-status">
      <span class="vg-bank" id="vg-bank">四级</span>
      <span class="vg-chip"><span data-en="New">新词</span> <b id="vg-new">0/0</b></span>
      <span class="vg-chip"><span data-en="Review">复习</span> <b id="vg-review">0/0</b></span>
      <span class="vg-chip"><span data-en="Left">剩余</span> <b id="vg-left">0</b></span>
      <span class="vg-chip"><span data-en="Total left">总时间</span> <b id="vg-total">—</b></span>
      <span class="vg-dot offline" id="vg-sync-dot" title="离线"></span>
    </header>
    <div class="vg-qbar" id="vg-qbar-wrap"><i id="vg-qbar" style="width:100%"></i></div>

    <section class="vg-view" id="vg-start">
      <div class="vg-card vg-start-card">
        <div class="vg-start-title" data-en="Vocabulary">背单词</div>
        <div class="vg-kv"><span data-en="Sign-in">登录状态</span><b id="vg-login">读取中…</b></div>
        <div class="vg-kv"><span data-en="Word bank">当前词库</span><b id="vg-start-bank">—</b></div>
        <div class="vg-kv"><span data-en="Today's plan">今日计划</span><b id="vg-start-plan">读取中…</b></div>
        <div class="vg-note" id="vg-start-note" hidden></div>
        <button class="vg-btn primary" id="vg-start-btn" type="button" data-en="Start" disabled>开始</button>
        <div class="vg-note" id="vg-voice-note" hidden data-en="Speech recognition unavailable; using tap mode.">语音识别不可用，已改用点选</div>
      </div>
    </section>

    <section class="vg-view" id="vg-play" hidden>
      <div class="vg-word-card">
        <div class="vg-word" id="vg-word">—</div>
        <div class="vg-phonetic-row">
          <span class="vg-phonetic" id="vg-phonetic"></span>
          <button class="vg-speak" id="vg-speak" type="button" title="重播" data-en-title="Play again">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
        </div>
      </div>
      <div class="vg-options" id="vg-options">
        <button class="vg-opt" type="button" data-index="1"><span class="vg-badge">1</span><span class="vg-opt-text"></span><span class="vg-opt-hint" data-en="1st">第一个</span></button>
        <button class="vg-opt" type="button" data-index="2"><span class="vg-badge">2</span><span class="vg-opt-text"></span><span class="vg-opt-hint" data-en="2nd">第二个</span></button>
        <button class="vg-opt" type="button" data-index="3"><span class="vg-badge">3</span><span class="vg-opt-text"></span><span class="vg-opt-hint" data-en="3rd">第三个</span></button>
        <button class="vg-opt" type="button" data-index="4"><span class="vg-badge">4</span><span class="vg-opt-text"></span><span class="vg-opt-hint" data-en="4th">第四个</span></button>
      </div>
      <button class="vg-unknown" id="vg-unknown" type="button" data-en="Don't know">不认识</button>
      <section class="vg-answer" id="vg-answer" hidden>
        <div class="vg-answer-word" id="vg-answer-word"></div>
        <div class="vg-answer-phonetic" id="vg-answer-phonetic"></div>
        <div class="vg-answer-meaning" id="vg-answer-meaning"></div>
        <button class="vg-btn primary" id="vg-continue" type="button" data-en="Continue">继续</button>
      </section>
    </section>

    <section class="vg-view vg-complete" id="vg-complete" hidden>
      <h1 id="vg-complete-title" data-en="Today's plan complete">今日完成</h1>
      <div class="sub" id="vg-complete-sub"></div>
      <div class="vg-stats">
        <div><b id="vg-stat-answers">0</b><span data-en="Answers today">今日答题数</span></div>
        <div><b id="vg-stat-first">—</b><span data-en="First-answer accuracy">首答正确率</span></div>
        <div><b id="vg-stat-due">0</b><span data-en="Due tomorrow">明日到期数</span></div>
      </div>
      <button class="vg-btn primary" id="vg-extra" type="button" data-en="Study another set">再学一组</button>
      <button class="vg-btn ghost" id="vg-back" type="button" data-en="Back to start" hidden>返回开始页</button>
    </section>
  </div>

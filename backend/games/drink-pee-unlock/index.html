<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-en="Drink / hold-pee unlock">喝水/憋尿解锁玩法</title>
<script type="application/json" id="game-manifest">
{
  "id": "drink-pee-unlock",
  "title": "喝水/憋尿解锁玩法",
  "description": "站上称重设备，保持提肛与踮脚，同时按模式持续变重（喝水）或变轻（憋尿）。达成目标重量变化或超时后自动解锁。踮脚可用 QTZ 双脚踏或 CUNZHI01 压力检测。",
  "howTo": "1. 映射称重设备（必需）\n2. 可选：气压传感器、踮脚检测、电击、振动、自动锁\n3. 选择喝水/憋尿模式与目标重量\n4. 开始后按提示保持动作，达标或超时解锁",
  "version": "2.3.2",
  "devices": [
    {
      "id": "scale",
      "label": "称重设备",
      "capabilities": [
        "weight",
        "reporting"
      ],
      "required": true
    },
    {
      "id": "sensor",
      "label": "提肛气压传感器",
      "capabilities": [
        "sphincterPressure",
        "reporting"
      ],
      "required": false
    },
    {
      "id": "qtz",
      "label": "QTZ踮脚检测",
      "capabilities": [
        "tiptoePressure"
      ],
      "required": false
    },
    {
      "id": "cunzhi",
      "label": "寸止踮脚传感器",
      "capabilities": [
        "tiptoePressure",
        "reporting"
      ],
      "required": false
    },
    {
      "id": "punish",
      "label": "电击惩罚设备",
      "capabilities": [
        "shock"
      ],
      "required": false
    },
    {
      "id": "vibe",
      "label": "振动设备",
      "capabilities": [
        "strength"
      ],
      "required": false
    },
    {
      "id": "lock",
      "label": "自动锁",
      "capabilities": [
        "lock"
      ],
      "required": false
    }
  ],
  "params": [
    {
      "key": "mode",
      "type": "enum",
      "default": "drink",
      "enum": [
        "drink",
        "pee"
      ],
      "enumLabels": {
        "drink": "喝水（变重）",
        "pee": "憋尿（变轻）"
      },
      "label": "玩法模式",
      "description": "喝水：体重增加达标；憋尿：体重减轻达标",
      "group": "core"
    },
    {
      "key": "durationSec",
      "type": "number",
      "default": 1800,
      "label": "最长时长",
      "unit": "秒",
      "description": "超时后自动结束并解锁。1800 秒 = 30 分钟",
      "group": "core",
      "min": 60,
      "max": 7200,
      "step": 30,
      "recommended": "初学者 900–1800"
    },
    {
      "key": "targetWeight",
      "type": "number",
      "default": 500,
      "label": "目标重量变化",
      "unit": "g",
      "description": "相对起始体重需要变化的克数，达到即成功",
      "group": "core",
      "min": 50,
      "max": 5000,
      "step": 50,
      "recommended": "500"
    },
    {
      "key": "changeThreshold",
      "type": "number",
      "default": 1,
      "label": "有效变化阈值",
      "unit": "g",
      "description": "小于此变化视为噪声，不计入进度",
      "group": "difficulty",
      "min": 0.1,
      "max": 50,
      "step": 0.1,
      "required": false
    },
    {
      "key": "stableWindowSec",
      "type": "number",
      "default": 30,
      "label": "历史窗口",
      "unit": "秒",
      "description": "用于平滑体重趋势的历史采样窗口",
      "group": "advanced",
      "min": 5,
      "max": 120,
      "step": 1,
      "required": false
    },
    {
      "key": "pressureThreshold",
      "type": "number",
      "default": 20,
      "label": "提肛气压阈值",
      "unit": "kPa",
      "description": "低于此值视为未提肛，可能触发惩罚（需映射气压传感器）",
      "group": "difficulty",
      "min": 1,
      "max": 100,
      "step": 0.5,
      "device": "sensor"
    },
    {
      "key": "tiptoePressureThreshold",
      "type": "number",
      "default": 100,
      "label": "踮脚压力阈值",
      "description": "CUNZHI01：压力高于此值视为脚落地（未踮脚）",
      "group": "difficulty",
      "min": 1,
      "max": 1000,
      "step": 1,
      "device": "cunzhi",
      "required": false
    },
    {
      "key": "tiptoeDebounceMs",
      "type": "number",
      "default": 300,
      "label": "踮脚防抖",
      "unit": "毫秒",
      "description": "压力抖动过滤时间，过小易误判",
      "group": "advanced",
      "min": 0,
      "max": 2000,
      "step": 50,
      "device": "cunzhi",
      "required": false
    },
    {
      "key": "punishCooldownSec",
      "type": "number",
      "default": 10,
      "label": "惩罚冷却",
      "unit": "秒",
      "description": "两次电击之间的最短间隔",
      "group": "punish",
      "min": 0,
      "max": 120,
      "step": 1,
      "device": "punish"
    },
    {
      "key": "shockIntensity",
      "type": "number",
      "default": 24,
      "label": "电击强度",
      "unit": "V",
      "description": "惩罚电击电压，建议不超过 30V",
      "group": "punish",
      "min": 1,
      "max": 50,
      "step": 1,
      "device": "punish",
      "recommended": "15–24"
    },
    {
      "key": "shockDuration",
      "type": "number",
      "default": 2,
      "label": "电击持续",
      "unit": "秒",
      "description": "单次电击持续时间",
      "group": "punish",
      "min": 0.5,
      "max": 10,
      "step": 0.5,
      "device": "punish"
    },
    {
      "key": "vibeStartProb",
      "type": "number",
      "default": 0.05,
      "label": "振动启动概率",
      "unit": "每秒",
      "description": "每秒触发振动的概率，0.05 = 约 5%",
      "group": "reward",
      "min": 0,
      "max": 1,
      "step": 0.01,
      "device": "vibe",
      "required": false
    },
    {
      "key": "vibeIntensity",
      "type": "number",
      "default": 255,
      "label": "振动强度",
      "unit": "0-255",
      "description": "振动设备输出强度",
      "group": "reward",
      "min": 0,
      "max": 255,
      "step": 1,
      "device": "vibe",
      "required": false
    },
    {
      "key": "vibeDuration",
      "type": "number",
      "default": 3,
      "label": "振动时长",
      "unit": "秒",
      "description": "单次振动持续时间",
      "group": "reward",
      "min": 0.5,
      "max": 30,
      "step": 0.5,
      "device": "vibe",
      "required": false
    },
    {
      "key": "voiceEnabled",
      "type": "boolean",
      "default": true,
      "label": "语音提示",
      "description": "开启后播报阶段与提示音",
      "group": "core"
    }
  ],
  "i18n": {
    "en": {
      "title": "Drink / hold-pee unlock",
      "description": "Stand on a scale, keep pelvic squeeze and tiptoe, and get heavier (drink) or lighter (hold pee) by mode. Unlock after the target weight change or timeout. Tiptoe can use QTZ dual pedals or CUNZHI01 pressure.",
      "howTo": "1. Map a scale (required)\n2. Optional: air-pressure sensor, tiptoe, shock, vibe, lock\n3. Choose drink/hold-pee mode and target weight\n4. Keep the pose; unlock on target or timeout",
      "devices": {
        "scale": "Scale",
        "sensor": "Pelvic air-pressure sensor",
        "qtz": "QTZ tiptoe sensor",
        "cunzhi": "Edging tiptoe sensor",
        "punish": "Shock punisher",
        "vibe": "Vibrator",
        "lock": "Auto lock"
      },
      "params": {
        "mode": "Mode",
        "durationSec": "Max duration",
        "targetWeight": "Target weight change",
        "changeThreshold": "Valid change threshold",
        "stableWindowSec": "History window",
        "pressureThreshold": "Pelvic pressure threshold",
        "tiptoePressureThreshold": "Tiptoe pressure threshold",
        "tiptoeDebounceMs": "Tiptoe debounce",
        "punishCooldownSec": "Punish cooldown",
        "shockIntensity": "Shock intensity",
        "shockDuration": "Shock duration",
        "vibeStartProb": "Vibe start chance",
        "vibeIntensity": "Vibe intensity",
        "vibeDuration": "Vibe duration",
        "voiceEnabled": "Voice prompts"
      },
      "enumLabels": {
        "mode": {
          "drink": "Drink (get heavier)",
          "pee": "Hold pee (get lighter)"
        }
      },
      "paramDescriptions": {
        "mode": "Drink: gain weight to the target. Hold pee: lose weight to the target.",
        "durationSec": "Auto-end and unlock after timeout. 1800s = 30 minutes.",
        "targetWeight": "Grams of change from start weight needed to succeed.",
        "changeThreshold": "Changes below this are treated as noise.",
        "stableWindowSec": "History window used to smooth weight trend.",
        "pressureThreshold": "Below this is treated as not squeezing (needs air-pressure sensor).",
        "tiptoePressureThreshold": "CUNZHI01: pressure above this means heel down.",
        "tiptoeDebounceMs": "Filter for pressure jitter. Too small causes false triggers.",
        "punishCooldownSec": "Minimum interval between shocks.",
        "shockIntensity": "Punish shock voltage. Keep at or below 30V.",
        "shockDuration": "Duration of one shock.",
        "vibeStartProb": "Chance per second to start vibration. 0.05 ≈ 5%.",
        "vibeIntensity": "Vibrator output intensity.",
        "vibeDuration": "Duration of one vibration.",
        "voiceEnabled": "Play stage and hint voice lines."
      },
      "paramUnits": {
        "durationSec": "s",
        "shockDuration": "s",
        "tiptoeDebounceMs": "ms",
        "vibeDuration": "s",
        "punishCooldownSec": "s",
        "stableWindowSec": "s",
        "vibeStartProb": "/s"
      }
    }
  }
}
</script>
<script src="/bridge-api/device-api-bridge.js"></script>
<script src="/bridge-api/game-i18n.js"></script>
<style>
  :root {
    --bg: #050505; --panel-bg: rgba(20, 20, 25, 0.9); --panel-border: #333;
    --primary: #00f0ff; --primary-dim: rgba(0, 240, 255, 0.2); --warn: #ffcc00;
    --danger: #ff003c; --ok: #00ff9d; --text: #e0e0e0; --text-muted: #666;
    --font-mono: "Consolas", "Monaco", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  .hud-container { max-width: 1200px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr; gap: 20px; }
  .hud-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--panel-border); padding-bottom: 15px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
  .hud-title { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px; color: var(--primary); text-transform: uppercase; text-shadow: 0 0 10px var(--primary-dim); }
  .hud-status-bar { display: flex; gap: 15px; }
  .status-tag { background: var(--panel-border); padding: 4px 12px; border-radius: 4px; font-size: 12px; font-family: var(--font-mono); border: 1px solid #444; }
  .status-tag b { color: #fff; }
  .dashboard-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
  .panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 20px; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  .panel::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--primary), transparent); opacity: 0.5; }
  .panel-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; }
  .panel-hero { grid-column: span 12; display: flex; flex-direction: column; justify-content: center; }
  .progress-display { position: relative; height: 40px; background: #111; border: 1px solid #333; border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .progress-fill { height: 100%; background: repeating-linear-gradient(45deg, var(--primary), var(--primary) 10px, var(--primary-dim) 10px, var(--primary-dim) 20px); width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 15px var(--primary); }
  .progress-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: bold; text-shadow: 0 1px 2px #000; z-index: 2; mix-blend-mode: exclusion; }
  .hero-stats { display: flex; justify-content: space-between; margin-top: 10px; font-family: var(--font-mono); font-size: 14px; flex-wrap: wrap; gap: 8px; }
  .hero-stat-item { color: var(--text-muted); }
  .hero-stat-item b { color: var(--text); margin-left: 5px; }
  .panel-metric { grid-column: span 6; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  @media (min-width: 768px) { .panel-metric { grid-column: span 3; } }
  .metric-value { font-family: var(--font-mono); font-size: 36px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
  .metric-unit { font-size: 14px; color: var(--text-muted); margin-top: -5px; }
  .tiptoe-indicator { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: bold; background: #111; border-radius: 4px; padding: 10px; }
  .tiptoe-indicator.ok { color: var(--ok); border: 1px solid var(--ok); box-shadow: inset 0 0 10px var(--ok); }
  .tiptoe-indicator.warn { color: var(--danger); border: 1px solid var(--danger); box-shadow: inset 0 0 10px var(--danger); animation: pulse 1s infinite; }
  .panel-terminal { grid-column: span 12; font-family: var(--font-mono); background: #000; border: 1px solid #333; }
  .terminal-logs { list-style: none; padding: 0; margin: 0; height: 150px; overflow-y: auto; font-size: 12px; }
  .terminal-logs li { padding: 4px 8px; border-bottom: 1px solid #111; display: flex; gap: 10px; }
  .terminal-logs li:before { content: '>'; color: var(--text-muted); }
  .l-info { color: #aaa; } .l-warn { color: var(--warn); } .l-error { color: var(--danger); }
  .text-danger { color: var(--danger) !important; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
  @media (max-width: 600px) { .hud-header { flex-direction: column; align-items: flex-start; gap: 10px; } .panel-metric { grid-column: span 6; } }
</style>
</head>
<body>
  <div class="hud-container">
    <header class="hud-header">
      <h1 class="hud-title" data-bind="title">喝水/憋尿解锁玩法</h1>
      <div class="hud-status-bar">
        <div class="status-tag"><span data-en="Status:">状态:</span> <b data-bind="statusText">初始化</b></div>
        <div class="status-tag"><span data-en="Left:">剩余:</span> <b data-bind="remainingSec">-</b>s</div>
      </div>
    </header>
    <main class="dashboard-grid">
      <div class="panel panel-hero">
        <span class="panel-label"><span data-en="Progress (start:">任务进度 (初始:</span> <span data-bind="initialWeight">-</span>g)</span>
        <div class="progress-display">
          <div class="progress-fill" id="progressBar" style="width: 0%"></div>
          <div class="progress-text"><span data-bind="progress">0</span> / <span data-bind="targetWeight">500</span> g</div>
        </div>
        <div class="hero-stats">
          <div class="hero-stat-item"><span data-en="Shocks:">电击触发次数:</span> <b data-bind="shockCount" class="text-danger">0</b></div>
          <div class="hero-stat-item"><span data-en="Shock device:">电击设备:</span> <b data-bind="punishDevice">未映射</b></div>
          <div class="hero-stat-item"><span data-en="Shock status:">电击状态:</span> <b data-bind="shockStatus" id="shockStatusVal">不可用</b></div>
          <div class="hero-stat-item"><span data-en="Shock params:">电击参数:</span> <b><span data-bind="shockIntensity">0</span>V / <span data-bind="shockDuration">0</span>s</b></div>
          <div class="hero-stat-item"><span data-en="Cooldown:">冷却时间:</span> <b data-bind="cooldownRemainingSec">0</b>s</div>
          <div class="hero-stat-item" style="color:var(--warn);"><span data-en="Punish reason:">惩罚原因:</span> <b data-bind="lastPunishReason"></b></div>
        </div>
      </div>
      <div class="panel panel-metric">
        <span class="panel-label" data-en="Current weight">当前重量</span>
        <div class="metric-value"><span data-bind="weight">-</span></div>
        <div class="metric-unit" data-en="grams (g)">克 (g)</div>
      </div>
      <div class="panel panel-metric">
        <span class="panel-label" data-en="Air pressure">气压值</span>
        <div class="metric-value"><span data-bind="pressure">-</span></div>
        <div class="metric-unit">kPa</div>
      </div>
      <div class="panel panel-metric">
        <span class="panel-label" data-en="Tiptoe">踮脚状态</span>
        <div class="tiptoe-indicator" id="tiptoeVal"><span data-bind="tiptoeOk">检查</span></div>
        <div class="metric-unit" style="margin-top:6px;"><span data-en="QTZ button:">QTZ按钮:</span> <b data-bind="tiptoeQtz">-</b> | <span data-en="Pressure:">压力:</span> <b data-bind="tiptoePressureText">-</b></div>
      </div>
      <div class="panel panel-metric">
        <span class="panel-label" data-en="Punish countdown">惩罚倒计时</span>
        <div class="metric-value" style="color:var(--warn);"><span data-bind="punishCountdown">-</span></div>
        <div class="metric-unit" data-en="seconds (s)">秒 (s)</div>
      </div>
      <div class="panel" style="grid-column: span 12;">
        <details>
          <summary style="cursor:pointer; color:var(--primary);"><span data-en="System metrics >>">系统指标 &gt;&gt;</span></summary>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-top:10px; font-family:var(--font-mono); font-size:12px;">
            <div><span data-en="Mode:">模式:</span> <b data-bind="modeCN">-</b></div>
            <div><span data-en="Min weight:">最小重:</span> <b data-bind="weightMin">-</b></div>
            <div><span data-en="Max weight:">最大重:</span> <b data-bind="weightMax">-</b></div>
            <div><span data-en="Min pressure:">最小压:</span> <b data-bind="pressureMin">-</b></div>
            <div><span data-en="Max pressure:">最大压:</span> <b data-bind="pressureMax">-</b></div>
            <div><span data-en="Samples:">采样数:</span> <b data-bind="weightCount">0</b></div>
            <div><span data-en="History window:">历史窗口:</span> <b data-bind="stableWindowSec">0</b>s</div>
            <div><span data-en="Punish cooldown:">惩罚冷却:</span> <b data-bind="punishCooldownSec">0</b>s</div>
            <div><span data-en="Tiptoe pressure:">踮脚压力:</span> <b data-bind="tiptoePressureText">-</b></div>
            <div><span data-en="Tiptoe threshold:">踮脚压力阈值:</span> <b data-bind="tiptoePressureThreshold">-</b></div>
            <div><span data-en="Tiptoe max:">踮脚压力Max:</span> <b data-bind="tiptoePressureMax">-</b></div>
          </div>
        </details>
      </div>
      <div class="panel panel-terminal">
        <span class="panel-label" data-en="System log">系统日志</span>
        <ul class="terminal-logs" id="logs"></ul>
      </div>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>

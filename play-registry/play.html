<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n-title="playTitle">运行玩法 · 玩法库</title>
<link rel="stylesheet" href="assets/css/site.css" />
<script src="assets/js/baidu-tongji.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<style>
  body { overflow: hidden; }
  .play-shell { display: flex; flex-direction: column; height: 100vh; }
  .play-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 20px; background: var(--bg-soft); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .play-bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .play-bar-back { color: var(--text-soft); font-size: 14px; }
  .play-bar-back:hover { color: var(--text); }
  .play-title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .play-conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .play-conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); }
  .play-conn.disconnected .dot { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .play-bar-actions { display: flex; gap: 8px; }
  .play-bar .btn { padding: 7px 14px; font-size: 13px; }
  .play-frame-wrap { flex: 1; position: relative; background: #06090f; min-height: 0; }
  .play-frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .play-loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--text-soft); gap: 12px; text-align: center;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .play-error {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 40px;
    background: var(--bg);
  }
  .play-error.show { display: grid; }
  .play-error h3 { color: var(--danger); margin-bottom: 12px; }
  .play-error p { color: var(--text-soft); margin-bottom: 8px; max-width: 480px; }
</style>
</head>
<body>
<div class="play-shell">
  <div class="play-bar">
    <div class="play-bar-left">
      <a class="play-bar-back" href="index.html"><span data-i18n="back">← 返回</span></a>
      <span class="play-title" id="play-title" data-i18n="playDefault">玩法</span>
      <span class="play-conn" id="play-conn"><span class="dot"></span> <span id="play-conn-text" data-i18n="loading">加载中</span></span>
    </div>
    <div class="play-bar-actions">
      <button class="btn btn-ghost" id="btn-reselect" data-i18n="reselect">重选设备</button>
      <button class="btn btn-ghost" id="btn-stop" data-i18n="stop">停止</button>
    </div>
  </div>
  <div class="play-frame-wrap">
    <div class="play-loading" id="play-loading">
      <div class="spinner"></div>
      <div data-i18n="loadingPlay">正在加载玩法…</div>
    </div>
    <div class="play-error" id="play-error">
      <div>
        <h3 data-i18n="cannotLoad">⚠ 无法加载玩法</h3>
        <p id="play-error-msg"></p>
        <p style="font-size:13px;color:var(--text-dim);"><span data-i18n="needPanel">需本机控制面板在线，且玩法经面板 gameProxy 加载。</span></p>
        <a class="btn btn-primary" href="index.html" style="margin-top:16px;"><span data-i18n="backLibrary">返回玩法库</span></a>
      </div>
    </div>
    <iframe id="play-iframe" allow="autoplay; fullscreen; gamepad; publickey-credentials-get" allowfullscreen></iframe>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script>
(function () {
  'use strict';
  // 从 sessionStorage 读启动参数（避免静态站 cleanURL 重写丢 query）
  var launch = null;
  try { launch = JSON.parse(sessionStorage.getItem('play-launch') || 'null'); } catch (_) {}
  sessionStorage.removeItem('play-launch');

  var launchUrl = launch && launch.launch;
  function t(zh, en) { try { if (window.SiteI18n && SiteI18n.isEn && SiteI18n.isEn()) return en; } catch (_) {} return zh; }
  var title = (launch && launch.title) || t('玩法', 'Play');
  var backend = (launch && launch.backend) || '';
  var gameId = (launch && launch.id) || '';

  document.getElementById('play-title').textContent = title;
  document.title = title + (t(' · 玩法库', ' · library'));

  var iframe = document.getElementById('play-iframe');
  var loading = document.getElementById('play-loading');
  var errBox = document.getElementById('play-error');
  var errMsg = document.getElementById('play-error-msg');
  var conn = document.getElementById('play-conn');
  var connText = document.getElementById('play-conn-text');

  if (!launchUrl) {
    showError(t('缺少 launch 参数', 'Missing launch parameter'));
    return;
  }

  // 超时兜底：8s 没加载完提示
  var loaded = false;
  var timeout = setTimeout(function () {
    if (!loaded) { /* 不报错，仅隐藏 loading 让 iframe 自己显示 */ loading.style.display = 'none'; }
  }, 8000);

  iframe.addEventListener('load', function () {
    loaded = true;
    clearTimeout(timeout);
    loading.style.display = 'none';
    updateConnStatus();
  });
  iframe.addEventListener('error', function () {
    showError(t('iframe 加载失败', 'iframe failed to load'));
  });

  iframe.src = launchUrl;

  // 连接状态：尝试探 iframe contentWindow 的 ws 不行（跨域），用 backend /api/devices 健康度近似
  function updateConnStatus() {
    if (!backend) return;
    fetch(backend + '/api/devices', { mode: 'cors' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (list) {
        var online = (list || []).filter(function (d) { return d.connected; }).length;
        if (online > 0) {
          conn.classList.remove('disconnected');
          connText.textContent = t('{n} 设备在线', '{n} devices online').replace('{n}', online);
        } else {
          conn.classList.add('disconnected');
          connText.textContent = t('无在线设备', 'No online devices');
        }
      })
      .catch(function () {
        conn.classList.add('disconnected');
        connText.textContent = t('面板离线', 'Panel offline');
      });
  }

  function showError(msg) {
    loading.style.display = 'none';
    iframe.style.display = 'none';
    errBox.classList.add('show');
    errMsg.textContent = msg;
  }

  // 停止：通知后端停当前 bridge 会话
  document.getElementById('btn-stop').addEventListener('click', function () {
    if (backend) {
      fetch(backend + '/api/games/stop-current', { method: 'POST', mode: 'cors' }).catch(function () {});
    }
    setTimeout(function () { location.href = 'index.html'; }, 200);
  });

  // 重选设备：回首页重新打开 modal
  document.getElementById('btn-reselect').addEventListener('click', function () {
    if (backend) {
      fetch(backend + '/api/games/stop-current', { method: 'POST', mode: 'cors' }).catch(function () {});
    }
    setTimeout(function () { location.href = gameId ? ('index.html?open=' + encodeURIComponent(gameId)) : 'index.html'; }, 200);
  });

  // 周期刷新连接状态
  setInterval(updateConnStatus, 5000);
  updateConnStatus();

  // 页面卸载时也通知停止
  window.addEventListener('beforeunload', function () {
    if (backend) {
      try { fetch(backend + '/api/games/stop-current', { method: 'POST', mode: 'cors', keepalive: true }); } catch (_) {}
    }
  });
})();
</script>
</body>
</html>

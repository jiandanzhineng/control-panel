<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n-title="submitTitle">登录投稿 · 硅基之下游戏库</title>
<meta name="description" content="向硅基之下游戏库提交 ZIP 游戏包或公开 Git 地址。" />
<meta name="theme-color" content="#0e0d0c" />
<link rel="stylesheet" href="assets/css/site.css" />
<script src="assets/js/baidu-tongji.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5b3a'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%231a0a04'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark">⚡</span><span data-i18n="brand">硅基之下游戏库</span></a>
    <div class="nav-links">
      <a href="games.html" data-i18n="navGames">游戏</a>
      <a href="control.html" data-i18n="navControl">设备控制</a>
      <a href="docs/agent-guide.html" data-i18n="navDocs">开发文档</a>
      <a href="docs/device-api.html" data-i18n="navDeviceApi">DeviceAPI</a>
      <a href="submit.html" class="nav-cta" data-i18n="navContribute">投稿</a>
      <div class="lang-switch">
        <button type="button" data-set-locale="zh">中</button>
        <button type="button" data-set-locale="en">EN</button>
      </div>
    </div>
    <div class="nav-account" data-auth-slot></div>
  </div>
</nav>

<main class="platform-page container">
  <p id="platform-message" class="platform-message" aria-live="polite"></p>

  <section id="dashboard" hidden>
    <header class="dash-head">
      <div>
        <h1 data-i18n="dashHeadH1">投稿工作台</h1>
        <p id="dash-email"></p>
      </div>
      <div class="platform-actions">
        <a id="author-link" href="author.html" class="btn btn-ghost" data-i18n="authorAdmin">作者管理</a>
        <a id="admin-link" href="admin.html" class="btn btn-ghost" hidden data-i18n="adminLink">审核后台</a>
      </div>
    </header>
    <section class="platform-panel">
      <div class="panel-title"><div>
        <h2 data-i18n="dashSubmitH2">提交游戏</h2>
        <p data-i18n="dashSubmitLead">ZIP 根目录必须有 index.html 与 game-manifest。公开 Git 仓库根目录须满足相同结构。</p>
      </div></div>
      <form id="submission-form" class="platform-form">
        <label>作者名<input name="authorName" type="text" minlength="2" maxlength="40" autocomplete="nickname" required /><span>仅作为本次投稿的署名，不会公开邮箱。</span></label>
        <label>游戏名称<input name="title" type="text" minlength="2" maxlength="100" required /></label>
        <label>玩法说明<textarea name="description" maxlength="2000" rows="4" placeholder="说明玩法、所需设备和安全注意事项"></textarea></label>
        <fieldset class="submission-kind"><legend>投稿方式</legend>
          <label><input type="radio" name="kind" value="zip" checked /> 上传 ZIP</label>
          <label><input type="radio" name="kind" value="git" /> 公开 Git 地址</label>
        </fieldset>
        <label id="zip-field">ZIP 游戏包<input id="zip-file" name="zipFile" type="file" accept=".zip,application/zip" required /><span>文件大小以服务端限制为准，上传后直达 OSS 隔离区。</span></label>
        <label id="git-field" hidden>公开 GitHub/GitLab 地址<input id="git-url" name="gitUrl" type="url" placeholder="https://github.com/owner/repository" /><span>仅保存地址供审核员查看；批准发布时才读取当时仓库内容。</span></label>
        <button class="btn btn-primary" type="submit">提交审核</button>
      </form>
    </section>
    <section class="platform-panel">
      <div class="panel-title"><div>
        <h2 data-i18n="dashMineH2">我的投稿</h2>
        <p data-i18n="dashMineLead">审核进度与意见会显示在这里。</p>
      </div></div>
      <div id="submission-list" class="submission-list"></div>
    </section>
    <section class="platform-panel">
      <div class="panel-title"><div>
        <h2 data-i18n="dashPayoutH2">我的分成</h2>
        <p data-i18n="dashPayoutLead">每月由平台人工统计游玩表现并人工发放奖励金到商城账号；发放后在这里可以看到发放记录。需先用同一账号登录过一次商城。</p>
      </div></div>
      <div id="payout-list" class="submission-list"></div>
    </section>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-links">
      <a href="games.html" data-i18n="navGames">游戏</a>
      <a href="control.html" data-i18n="navControl">设备控制</a>
      <a href="docs/agent-guide.html" data-i18n="navDocs">开发文档</a>
      <a href="docs/device-api.html" data-i18n="navDeviceApi">DeviceAPI</a>
      <a href="submit.html" data-i18n="navContribute">投稿</a>
    </div>
    <div><span data-i18n="footerNote">硅基之下游戏库 · UnderSilicon 控制面板 · 已发布内容由平台审核后同步</span></div>
  </div>
</footer>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/platform-config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/submission.js"></script>
</body>
</html>

name: deploy-play-site

# 仅更新 OSS 上的静态页面壳。游戏文件、ZIP 和 registry.json 只能由
# game-platform 服务发布，避免 GitHub Actions 与平台发生双写。
on:
  push:
    branches: [main, develop]
    paths:
      - 'play-registry/**'
      - '!play-registry/games/**'
      - '!play-registry/packages/**'
      - '!play-registry/registry.json'
      - '.github/workflows/deploy-play-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-play-site
  cancel-in-progress: false

jobs:
  deploy-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 验证静态站脚本
        working-directory: play-registry
        run: |
          npm ci
          npm test

      - name: 组装静态站壳
        run: |
          rm -rf site
          mkdir -p site
          cp -a play-registry/. site/
          rm -rf site/scripts site/test site/node_modules site/games site/packages
          rm -f site/package.json site/package-lock.json site/README.md site/.gitignore site/.gitattributes site/registry.json site/*.log

      - name: 部署静态站壳到阿里云 OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ezs-games
          OSS_PREFIX: ${{ vars.PLAY_REGISTRY_OSS_PREFIX }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install oss2
          python - <<'PY'
          import mimetypes
          import os
          from pathlib import Path

          import oss2

          site = Path("site")
          required = ["OSS_ENDPOINT", "OSS_ACCESS_KEY_ID", "OSS_ACCESS_KEY_SECRET"]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit(f"Missing required OSS secrets: {', '.join(missing)}")

          endpoint = os.environ["OSS_ENDPOINT"].strip()
          bucket_name = os.environ.get("OSS_BUCKET", "ezs-games").strip() or "ezs-games"
          prefix = os.environ.get("OSS_PREFIX", "").strip("/")
          auth = oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"].strip(), os.environ["OSS_ACCESS_KEY_SECRET"].strip())
          bucket = oss2.Bucket(auth, endpoint, bucket_name)

          mimetypes.add_type("application/javascript; charset=utf-8", ".js")
          mimetypes.add_type("text/css; charset=utf-8", ".css")
          mimetypes.add_type("text/html; charset=utf-8", ".html")
          files = sorted(path for path in site.rglob("*") if path.is_file())
          if not files:
              raise SystemExit("No static files found")

          for path in files:
              rel = path.relative_to(site).as_posix()
              key = f"{prefix}/{rel}" if prefix else rel
              content_type, _ = mimetypes.guess_type(rel)
              headers = {"Cache-Control": "no-cache, max-age=60" if rel.endswith(".html") else "public, max-age=300"}
              if content_type:
                  headers["Content-Type"] = content_type
              print(f"Uploading {path} to oss://{bucket_name}/{key}")
              bucket.put_object_from_file(key, str(path), headers=headers)
          PY
